headline: "Keeping water systems safe, reliable, and resilient"
intro: >-
  Licensed Staff Water Resources Engineer at Arcadis with a Ph.D. in Civil and Infrastructure Systems
  from Vanderbilt University, focused on the modeling, optimization, control, and monitoring
  of water systems. With a foundation that bridges research and industry best practices, I help
  utilities build and calibrate network models, plan capital investments, and keep water safe
  from the treatment plant to the tap.

hero_note: >-
  A small model of a drinking water distribution network. Chlorine leaves the water treatment
  plant and decays as it travels, disinfecting and guarding against pathogens along the way.
hero_note_fine: "Illustrative values, not an actual calibrated simulation. Numbers are approximate."

