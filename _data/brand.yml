# ---------- Projects ----------
# kind: industry or research. image is optional.
projects:
  - title: Where to put chlorine booster stations
    kind: research
    image: /assets/images/covers/WQCont.jpg
    outcome: A placement method based on structural controllability that holds up as hydraulics change through the day.
    tags: [Water quality, Control theory]
    link: /publications
  - title: Sensors that see contamination
    kind: research
    image: /assets/images/covers/SPMS.jpg
    outcome: Sensor placement for nonlinear multi-species quality models, published in the Journal of Water Process Engineering.
    tags: [Monitoring, Observability]
    link: /publications
  - title: X-WHAT open-source network design
    kind: industry
    image: /assets/images/covers/LoopX.jpg
    outcome: A free Excel model for designing and optimizing looped distribution networks, built for engineers without costly software.
    tags: [Design, Open source]
    link: /publications
  - title: Disinfectant control with byproduct limits
    kind: research
    image: /assets/images/covers/DBP.jpg
    outcome: Controls chlorine across a network while keeping disinfection byproducts within limits, published in Water Research.
    tags: [Water quality, Public health]
    link: /publications
