portrait: /assets/images/photos/portrait-studio.jpg

# ---------- What I do ----------
services:
  - title: Hydraulic and water quality modeling
    summary: Building and calibrating network models that show how water and disinfectant actually move.
    examples:
      - Multi-species chlorine and disinfection byproduct models
      - Pressure, flow and water age analysis for distribution networks
      - "Open-source tools such as X-WHAT, a looped network design model in Excel"
  - title: Asset management and capital planning
    summary: Turning condition, risk and performance data into investment plans utilities can defend.
    examples:
      - "PLACEHOLDER: risk-based pipe renewal prioritization"
      - "PLACEHOLDER: multi-year capital improvement programs"
  - title: Resilience and strategic planning
    summary: Helping systems prepare for demand growth, aging assets, contamination events and climate stress.
    examples:
      - "PLACEHOLDER: master planning and long-term supply scenarios"
      - Contamination event response through sensor and booster placement
  - title: Research and algorithm development
    summary: Control and network theory applied to real water infrastructure problems.
    examples:
      - Booster station and sensor placement with controllability and observability metrics
      - Joint hydraulic and water quality control, including quality-aware pump scheduling
      - Model order reduction for large nonlinear water quality models

