# ---------- Industry / Research switch (the "About" section) ----------
sides_title: "Two Sides, One Mission"
sides_subtitle: "Bridging research and practice."
sides:
  industry:
    label: Industry
    role: Staff Water Resources Engineer
    org: Arcadis U.S., Inc.
    period: 2025 – present
    text: >-
      As a licensed Professional Engineer (P.E.) and consultant, I support utilities and
      municipalities with planning, modeling, calibration, and asset management, turning
      complex system data into decisions they can act on.
    list_title: Expertise and responsibilities
    points:
      - "<strong>Hydraulic modeling and calibration:</strong> building, updating, and calibrating distribution system models against field and SCADA data, then testing how the system performs across demand and operating scenarios, from everyday conditions to peak demand, to support sound operational and planning decisions"
      - "<strong>Advanced water quality modeling and calibration:</strong> multi-species chlorine and chloramine dynamics, blending zones where different source waters meet, water age, and disinfection byproduct analyses that support regulatory compliance and day-to-day operations"
      - "<strong>Field data analysis:</strong> planning and interpreting hydrant flow tests, pressure logging, water quality sampling, and bottle tests so models reflect how the system really behaves"
      - "<strong>Asset management and capital improvement planning (CIP):</strong> combining hydraulic criticality from network models with condition and risk data, including the likelihood and consequence of pipe failure, to decide which assets matter most and when to act, then turning those priorities into replacement programs and capital plans phased around current performance, future development, and realistic operating scenarios"
  research:
    label: Research
    role: Ph.D., Civil and Infrastructure Systems
    org: Vanderbilt University, Nashville, TN
    period: 2021 – 2025
    text: >-
      My dissertation, <a href="https://ir.vanderbilt.edu/items/c49b5d69-a819-42d2-b7b5-4c6dcceac6a1" target="_blank" rel="noopener"><em>Monitoring and Control of Quantity-Quality Dynamics for Resilient Drinking Water Networks</em></a>,
      developed a framework that manages hydraulics and water quality together, from multi-species
      chlorine modeling and pump operations to the placement of sensors and booster stations.
    list_title: Research interests I continue to explore independently
    points:
      - Control and monitoring of water distribution networks through integrated hydraulic and water quality dynamics
      - Resilience of water infrastructure to extreme events and long-term stresses
      - Sustainable water resources management under a changing climate
      - Cyber-physical systems, urban infrastructure, and optimization of dynamic systems

# ---------- Projects (its own page) ----------
projects_page:
  title: Projects
  intro: Real systems, real data, real decisions.
# Projects, newest first. Each opens to show its sections.
# summary: one line shown when closed. year and tags are optional.
# sections: any mix you like, e.g. Description, Responsibilities, Scope.
#   Each section has a label and either text: (a paragraph) or points: (a list).
# image: optional, shown inside the open project.
projects:
  - title: Water Quality and Hydraulic Modeling for Chlorine Residual, San Jose Water, CA
    summary: Working with San Jose Water to build and calibrate a model that tracks free chlorine, chloramine, and the blending between them.
    year: "2025–present"
    tags: [Water quality modeling, Multi-species (MSX), Chloramine blending, Calibration, AquaTwin Pro]
    sections:
      - label: Description
        text: >-
          San Jose Water is preparing for anticipated changes to the US EPA's disinfectant
          requirements. Meeting them will take operational changes, including managing the blending
          zones where water disinfected with free chlorine meets water disinfected with monochloramine.
          The project builds a water quality model that tracks both disinfectants, and how they mix,
          across the whole system.
      - label: Scope
        points:
          - Benchmark existing calibration procedures against similar utilities and industry best practices
          - Adapt the existing hydraulic model for chemical trace modeling with Aquanuity's AquaTwin Pro multi-species extension (MSX)
          - Calibrate the model with field samples
          - Train utility staff to build and calibrate water quality models
      - label: Responsibilities
        points:
          - Building a dashboard that brings together all water quality field sampling data, with quantitative and qualitative analyses
          - Running water age simulations and comparing the results with field sampling data
          - Developing an MSX model in AquaTwin Pro that traces each water source (surface water and groundwater) and disinfectant, used to produce blending exhibits
          - Analyzing hold studies and developing disinfectant decay curves
          - Coordinating with EPA on the development of the multi-species chloramine model, then feeding it into the MSX model, running it on the system, exporting the results, and building a calibration dashboard
          - Working with Aquanuity to add new features to its newly released MSX tools, streamlining our workflow and future work for utilities
  - title: Water Modeling and Field Support, City of Houston, TX
    summary: Hydraulic and water quality modeling of a large, complex system with free chlorine and chloramine blending zones, from source tracing to model calibration.
    year: "2023–present"
    tags: [Hydraulic modeling, Water quality modeling, Water age, Demand forecasting, WaterGEMS]
    sections:
      - label: Description
        text: >-
          Professional engineering services supporting the City of Houston's drinking water planning
          through modeling, field testing, and calibration.
      - label: Scope
        points:
          - Model assessment, data review and analysis, and model updates
          - Hydraulic calibration, plus water quality model development and calibration
          - Demand forecasting and technical support for drinking water planning
      - label: Responsibilities
        points:
          - Building a dashboard that brings together all water quality field sampling data, with quantitative and qualitative analyses
          - Running water age and source trace analyses, and developing maps that highlight zones with high water age
          - Identifying blending zones where water disinfected with free chlorine meets water disinfected with monochloramine
          - Coordinating with EPA on the development of the multi-species chloramine model
          - Supporting development of an MSX model of free chlorine and monochloramine that traces disinfectant behavior across the system and lays the groundwork for its calibration

