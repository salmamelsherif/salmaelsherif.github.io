headline: "Keeping water systems safe, reliable, and resilient"
intro: >-
  Staff Water Resources Engineer at Arcadis with a Ph.D. in Civil and Infrastructure Systems
  from Vanderbilt University, focused on the modeling, optimization, control, and monitoring
  of water systems. I bring research into practice, helping utilities build and calibrate
  network models, plan capital investments, and keep water safe from the treatment plant to the tap.

hero_note: >-
  A small model of a drinking water system. Chlorine leaves the plant and decays as it travels;
  hover or tap any node, pump or valve to inspect it.

